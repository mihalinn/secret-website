<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tool</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container" id="main-content">
        <header class="header">
            <div class="status-badge">
                <span class="status-dot"></span>
                Attendance Tool
            </div>
            <h1>Daily Report</h1>
        </header>

        <main class="grid single-column wide-layout">
            <section class="card glass form-card">

                <!-- Row 1: All selects and time inputs in ONE horizontal line -->
                <div class="form-row">
                    <!-- Start -->
                    <div class="field">
                        <label>始業</label>
                        <select id="start-type" onchange="updateConnectors()">
                            <option value="(出社)">(出社)</option>
                            <option value="(早出)">(早出)</option>
                            <option value="(直行)">(直行)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>時刻</label>
                        <div class="time-ctrl">
                            <button onclick="adjTime('start-time', -15)">−</button>
                            <input type="time" id="start-time" value="09:00" step="300">
                            <button onclick="adjTime('start-time', 15)">+</button>
                        </div>
                    </div>

                    <div class="field-sep"></div>

                    <!-- Connector 1 -->
                    <div class="field">
                        <label>接続</label>
                        <select id="conn-1">
                            <option value="～">～</option>
                            <option value="(休5)">(休5)</option>
                            <option value="(継続)">(継続)</option>
                            <option value="">(なし)</option>
                        </select>
                    </div>

                    <div class="field-sep"></div>

                    <!-- Middle -->
                    <div class="field">
                        <label>業務</label>
                        <select id="middle-type">
                            <option value="外勤">外勤</option>
                            <option value="外勤同行">外勤同行</option>
                            <option value="内勤">内勤</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>件数</label>
                        <select id="visit-count">
                            <option value="1件">1件</option>
                            <option value="2件">2件</option>
                            <option value="3件">3件</option>
                            <option value="4件">4件</option>
                            <option value="5件">5件</option>
                            <option value="">-</option>
                        </select>
                    </div>

                    <div class="field-sep"></div>

                    <!-- Return -->
                    <div class="field">
                        <label>帰着</label>
                        <select id="return-type">
                            <option value="(帰社)">(帰社)</option>
                            <option value="(直帰)">(直帰)</option>
                            <option value="">(なし)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>時刻</label>
                        <div class="time-ctrl">
                            <button onclick="adjTime('return-time', -15)">−</button>
                            <input type="time" id="return-time" value="16:00" step="300">
                            <button onclick="adjTime('return-time', 15)">+</button>
                        </div>
                    </div>

                    <div class="field-sep"></div>

                    <!-- Connector 2 -->
                    <div class="field">
                        <label>接続</label>
                        <select id="conn-2">
                            <option value="(継続)">(継続)</option>
                            <option value="～">～</option>
                            <option value="(休15)">(休15)</option>
                            <option value="">(なし)</option>
                        </select>
                    </div>

                    <div class="field-sep"></div>

                    <!-- End -->
                    <div class="field">
                        <label>付帯</label>
                        <select id="end-content">
                            <option value="付帯業務">付帯業務</option>
                            <option value="事務処理">事務処理</option>
                            <option value="会議">会議</option>
                            <option value="">(なし)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>終業</label>
                        <select id="end-type">
                            <option value="(退社)">(退社)</option>
                            <option value="(直帰)">(直帰)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>時刻</label>
                        <div class="time-ctrl">
                            <button onclick="adjTime('end-time', -15)">−</button>
                            <input type="time" id="end-time" value="17:45" step="300">
                            <button onclick="adjTime('end-time', 15)">+</button>
                        </div>
                    </div>
                </div>

                <!-- Result Area -->
                <div class="preview-area">
                    <div class="result-box" id="result-text">...</div>
                    <div class="preview-actions">
                        <button class="btn-icon" onclick="copyResult()" title="Copy">📋 Copy</button>
                        <div class="overtime-badge" id="overtime-val">0:00</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function formatTime(timeVal) {
            if (!timeVal) return "";
            return timeVal.replace(":", "");
        }

        function getMinutes(timeStr) {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function adjTime(id, mins) {
            const el = document.getElementById(id);
            if (!el.value) {
                if (id === 'return-time') el.value = '16:00';
                else if (id === 'start-time') el.value = '09:00';
                else el.value = '17:45';
            }

            let cur = getMinutes(el.value);
            cur += mins;

            if (cur < 0) cur += 24 * 60;
            if (cur >= 24 * 60) cur -= 24 * 60;

            const h = Math.floor(cur / 60);
            const m = cur % 60;
            el.value = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;

            el.dispatchEvent(new Event('input'));
            el.dispatchEvent(new Event('change'));
        }

        function updateConnectors() {
            const startType = document.getElementById('start-type').value;
            const conn1 = document.getElementById('conn-1');

            if (startType === '(早出)') {
                conn1.value = '(休5)';
            } else {
                conn1.value = '～';
            }
            generateReport();
        }

        function calcOvertime() {
            const startStr = document.getElementById('start-time').value;
            const endStr = document.getElementById('end-time').value;
            const conn1 = document.getElementById('conn-1').value;
            const conn2 = document.getElementById('conn-2').value;

            const standardStartMin = getMinutes('09:00');
            const standardEndMin = getMinutes('17:45');

            const startMin = getMinutes(startStr);
            const endMin = getMinutes(endStr);

            let otMinutes = 0;

            if (startMin < standardStartMin) {
                otMinutes += (standardStartMin - startMin);
                if (conn1 === '(休5)') otMinutes -= 5;
            }

            if (endMin > standardEndMin) {
                otMinutes += (endMin - standardEndMin);
                if (conn2 === '(休15)') otMinutes -= 15;
            }

            if (otMinutes < 0) otMinutes = 0;

            const h = Math.floor(otMinutes / 60);
            const m = otMinutes % 60;
            const text = otMinutes > 0 ? `+${h}:${m.toString().padStart(2, '0')}` : "0:00";

            const badge = document.getElementById('overtime-val');
            badge.textContent = text;
            badge.style.background = otMinutes > 0 ? 'rgba(52, 211, 153, 0.2)' : 'rgba(255,255,255,0.1)';
            badge.style.color = otMinutes > 0 ? '#34d399' : '#94a3b8';
        }

        function generateReport() {
            const startType = document.getElementById('start-type').value;
            const startTime = formatTime(document.getElementById('start-time').value);
            const conn1 = document.getElementById('conn-1').value;

            const midType = document.getElementById('middle-type').value;
            const midCount = document.getElementById('visit-count').value;
            const middle = midType + midCount;

            const retType = document.getElementById('return-type').value;
            const retTime = formatTime(document.getElementById('return-time').value);
            let retPart = "";
            if (retType) {
                retPart = retType + retTime;
            }

            const conn2 = document.getElementById('conn-2').value;
            const endContent = document.getElementById('end-content').value;
            const endType = document.getElementById('end-type').value;
            const endTime = formatTime(document.getElementById('end-time').value);

            let result = `${startType}${startTime}${conn1}${middle}${retPart}${conn2}${endContent}${endType}${endTime}`;

            document.getElementById('result-text').textContent = result;
            calcOvertime();
        }

        function copyResult() {
            const text = document.getElementById('result-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-icon');
                const original = btn.innerHTML;
                btn.innerHTML = "✅ Copied";
                setTimeout(() => btn.innerHTML = original, 1200);
            });
        }

        const formInputs = document.querySelectorAll('input, select');
        formInputs.forEach(el => {
            el.addEventListener('input', () => {
                generateReport();
                calcOvertime();
            });
        });

        window.onload = () => {
            generateReport();
            calcOvertime();
        };
    </script>
</body>

</html>
