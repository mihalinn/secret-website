<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠詳細作成ツール</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container" id="main-content">

        <!-- ヘッダー -->
        <header class="header">
            <nav class="top-nav">
                <a href="index.html" class="nav-link active">勤怠詳細</a>
                <a href="driving_report.html" class="nav-link">運行日報</a>
                <a href="pdfcompress.html" class="nav-link">PDF圧縮</a>
            </nav>
            <div class="status-badge">
                <span class="status-dot"></span>
                Attendance Tool
            </div>
            <h1>Daily Report</h1>
        </header>

        <!-- メインコンテンツ -->
        <main class="grid single-column wide-layout">
            <section class="card glass form-card">
                <div class="top-right-actions">
                    <button id="btn-reset-all" class="btn-icon-text" title="すべてリセット">
                        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                        <span class="label">リセット</span>
                    </button>
                    <button class="btn-theme-toggle" title="完了場所設定" id="btn-settings">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                    <button class="btn-theme-toggle" title="テーマ切替" id="theme-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"
                            style="display:none;">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                </div>

                <div class="preset-toolbar">
                    <div class="preset-dropdown" id="preset-dropdown">
                        <button class="preset-trigger" id="dropdown-trigger">
                            <span id="current-preset-name">履歴を選択...</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="preset-menu" id="dropdown-menu"></div>
                    </div>
                    <button class="btn-save-preset" id="btn-save-preset" title="現在の状態を保存 (上書き)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        <span>保存</span>
                    </button>

                    <div class="save-custom-area">
                        <input type="date" id="save-date" class="save-date-input" title="保存する日付を指定">
                        <button id="btn-save-custom" class="btn-secondary btn-save-custom" title="指定した日付で保存">
                            <span>指定日保存</span>
                        </button>
                    </div>
                </div>

                <!-- 8列グリッド: ラベル2段 + コントロール2段 -->
                <div class="ctrl-grid">

                    <!-- 行1: メインラベル -->
                    <div class="lbl main forget-container">
                        <span>始業</span>
                        <label class="forget-label"><input type="checkbox" id="start-forget"> 打忘</label>
                    </div>
                    <span class="lbl main"></span>
                    <span class="lbl main">業務</span>
                    <span class="lbl main">完了場所</span>
                    <span class="lbl main">帰着</span>
                    <span class="lbl main"></span>
                    <span class="lbl main">業務</span>
                    <div class="lbl main forget-container">
                        <span>就業</span>
                        <label class="forget-label"><input type="checkbox" id="end-forget"> 打忘</label>
                    </div>


                    <!-- 行2: セレクト -->
                    <select id="start-type">
                        <option value="(出社)">(出社)</option>
                        <option value="(早出)">(早出)</option>
                        <option value="(直行)">(直行)</option>
                        <option value="(車両出社)">(車両出社)</option>
                        <option value="(早出・直行)">(早出・直行)</option>
                    </select>

                    <select id="conn-1">
                        <option value="～">～</option>
                        <option value="(休5)">(休5)</option>
                        <option value="(継続)">(継続)</option>
                    </select>

                    <select id="middle-type">
                        <option value="外勤">外勤</option>
                        <option value="外勤同行">外勤同行</option>
                        <option value="付帯業務">付帯業務</option>
                    </select>

                    <select id="middle-type-2">
                        <!-- JSで動的生成 -->
                    </select>

                    <select id="return-type">
                        <option value="(帰社)">(帰社)</option>
                        <option value="">-</option>
                    </select>

                    <select id="conn-2">
                        <option value="(継続)">(継続)</option>
                        <option value="(休15)">(休15)</option>
                        <option value="～">～</option>
                        <option value="">-</option>
                    </select>

                    <select id="end-content">
                        <option value="付帯業務">付帯業務</option>
                        <option value="">-</option>
                    </select>

                    <select id="end-type">
                        <option value="(退社)">(退社)</option>
                        <option value="(直帰)">(直帰)</option>
                        <option value="(車持)">(車持)</option>
                    </select>

                    <!-- 行4: 時刻・件数コントロール -->
                    <div class="time-ctrl">
                        <button class="btn-fine btn-time-adj" data-target="start-time"
                            data-minutes="-1">&lsaquo;</button>
                        <button class="btn-time-adj" data-target="start-time" data-minutes="-15">&minus;</button>
                        <input type="time" id="start-time" value="09:00" step="60">
                        <button class="btn-time-adj" data-target="start-time" data-minutes="15">+</button>
                        <button class="btn-fine btn-time-adj" data-target="start-time"
                            data-minutes="1">&rsaquo;</button>
                    </div>

                    <div class="cell-empty"></div>

                    <select id="visit-count">
                        <option value="1件">1件</option>
                        <option value="2件">2件</option>
                        <option value="3件">3件</option>
                        <option value="4件">4件</option>
                        <option value="5件">5件</option>
                        <option value="6件">6件</option>
                        <option value="7件">7件</option>
                        <option value="8件">8件</option>
                        <option value="">-</option>
                    </select>

                    <div class="cell-empty"></div>

                    <div class="time-ctrl">
                        <button class="btn-fine btn-time-adj" data-target="return-time"
                            data-minutes="-1">&lsaquo;</button>
                        <button class="btn-time-adj" data-target="return-time" data-minutes="-15">&minus;</button>
                        <input type="time" id="return-time" value="16:00" step="60">
                        <button class="btn-time-adj" data-target="return-time" data-minutes="15">+</button>
                        <button class="btn-fine btn-time-adj" data-target="return-time"
                            data-minutes="1">&rsaquo;</button>
                    </div>

                    <div class="cell-empty"></div>
                    <div class="cell-empty"></div>

                    <div class="time-ctrl">
                        <button class="btn-fine btn-time-adj" data-target="end-time" data-minutes="-1">&lsaquo;</button>
                        <button class="btn-time-adj" data-target="end-time" data-minutes="-15">&minus;</button>
                        <input type="time" id="end-time" value="17:45" step="60">
                        <button class="btn-time-adj" data-target="end-time" data-minutes="15">+</button>
                        <button class="btn-fine btn-time-adj" data-target="end-time" data-minutes="1">&rsaquo;</button>
                    </div>


                </div>

                <!-- 結果エリア -->
                <div class="preview-area">
                    <div class="result-box" id="result-text" contenteditable="true">...</div>
                    <div class="preview-actions">
                        <button class="btn-icon" id="btn-copy-result" title="Copy">Copy</button>
                        <div class="overtime-group">
                            <span class="overtime-label">休憩</span>
                            <div class="overtime-badge" style="background: var(--ot-inactive-bg); color: #94a3b8;">
                                <span class="ot-part copyable ot-copy-target" id="break-h" title="時間をコピー">0</span>
                                <span class="ot-sep">:</span>
                                <span class="ot-part copyable ot-copy-target" id="break-m" title="分をコピー">00</span>
                            </div>
                        </div>
                        <div class="overtime-group">
                            <span class="overtime-label">実績</span>
                            <div class="overtime-badge">
                                <span class="ot-part copyable ot-copy-target" id="ot-actual-h" title="時間をコピー">0</span>
                                <span class="ot-sep">:</span>
                                <span class="ot-part copyable ot-copy-target" id="ot-actual-m" title="分をコピー">00</span>
                            </div>
                        </div>
                        <div class="overtime-group">
                            <span class="overtime-label">申請</span>
                            <div class="overtime-badge">
                                <span class="ot-part copyable ot-copy-target" id="ot-round-h" title="時間をコピー">0</span>
                                <span class="ot-sep">:</span>
                                <span class="ot-part copyable ot-copy-target" id="ot-round-m" title="分をコピー">00</span>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- 申請リマインダー -->
                <div id="reminder-area" class="reminder-area"></div>

            </section>
        </main>
    </div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>完了場所設定</h2>
                <button id="btn-close-modal" class="btn-close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <section class="settings-section">
                    <h3>デフォルト設定</h3>
                    <p class="modal-desc">現在の入力内容を初期値として保存します。</p>
                    <button id="btn-save-default" class="btn-secondary"
                        style="width:100%; margin-bottom:8px;">現在の状態をデフォルトに保存</button>
                    <span id="msg-save-default" class="success-msg"></span>
                </section>
                <hr style="border:0; border-top:1px solid var(--glass-border); margin:16px 0;">
                <p class="modal-desc">よく行く場所を選択してください（リストの上位に表示されます）</p>
                <div id="location-settings-list" class="settings-grid">
                    <!-- JSで生成 -->
                </div>

                <hr style="border:0; border-top:1px solid var(--glass-border); margin:24px 0 16px 0;">
                <h3 style="margin-bottom: 8px; font-size: 1rem;">完了場所の一括登録</h3>
                <p class="modal-desc">スプレッドシート等で作成した場所リスト（CSV）を読み込んで設定できます。</p>
                <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                    <input type="file" id="input-import-csv" accept=".csv" style="display: none;">
                    <button id="btn-import-csv" class="btn-primary"
                        style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        CSVファイルを選択して登録
                    </button>
                    <p style="font-size: 0.75rem; color: var(--text-secondary); text-align: center;">
                        <a href="sample_location_master.csv" download
                            style="color: var(--accent-light); text-decoration: underline;">見本CSVをダウンロード</a>
                    </p>
                </div>

                <details style="margin-top: 24px;">
                    <summary style="font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;">詳細・バックアップ</p>
                    </summary>
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <input type="file" id="input-import-config" accept=".json" style="display: none;">
                        <button id="btn-import-config" class="btn-secondary"
                            style="flex: 1; border-style: dashed; font-size: 0.8rem;">JSON読込</button>
                        <button id="btn-save-json" class="btn-secondary"
                            style="flex: 1; border-style: dashed; font-size: 0.8rem;">JSON保存</button>
                    </div>
                </details>
            </div>
            <div class="modal-footer">
                <button id="btn-save-settings" class="btn-primary">保存して閉じる</button>
            </div>
        </div>
    </div>

    <!-- 履歴一覧モーダル -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>保存履歴一覧</h2>
                <button id="btn-close-history" class="btn-close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">保存済みの履歴データ一覧です。</p>
                <div id="history-list" class="history-list-container">
                    <!-- JSで生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-close-history-footer" class="btn-primary">閉じる</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="index.js"></script>
</body>

</html>
