<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Tools</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="common.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container" id="main-content">

        <!-- ヘッダー -->
        <header class="header">
            <div class="status-badge">
                <span class="status-dot"></span>
                Business Tools
            </div>
            <h1>Tool Dashboard</h1>
        </header>

        <!-- ツール一覧 -->
        <main class="grid single-column wide-layout">
            <section class="card glass form-card">
                <button class="btn-theme-toggle" onclick="toggleTheme()" title="テーマ切替" id="theme-btn">&#9790;</button>

                <div class="tool-grid">

                    <a href="attendance.html" class="card tool-card">
                        <span class="tool-card-icon">📋</span>
                        <span class="tool-card-title">勤怠詳細作成</span>
                        <span class="tool-card-desc">日報の勤怠詳細テキストを素早く生成。残業計算もワンクリック。</span>
                        <span class="tool-card-arrow">→ 開く</span>
                    </a>

                    <div class="card tool-card" style="opacity: 0.4; cursor: default;">
                        <span class="tool-card-icon">🔧</span>
                        <span class="tool-card-title">Coming Soon...</span>
                        <span class="tool-card-desc">新しいツールを追加予定</span>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="common.js"></script>
</body>

</html>
