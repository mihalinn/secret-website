<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運行日報作成</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="driving_report.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container" id="main-content">

        <!-- ヘッダー -->
        <header class="header">
            <nav class="top-nav">
                <a href="index.html" class="nav-link">勤怠詳細</a>
                <a href="driving_report.html" class="nav-link active">運行日報</a>
                <a href="pdfcompress.html" class="nav-link">PDF圧縮</a>
            </nav>
            <div class="status-badge">
                <span class="status-dot"></span>
                Daily Driving Report
            </div>
            <h1>運行日報</h1>
        </header>

        <!-- メインコンテンツ -->
        <main class="grid single-column wide-layout">
            <section class="card glass form-card">
                <button class="btn-theme-toggle" title="テーマ切替" id="theme-btn">&#9790;</button>
                <button class="btn-theme-toggle" title="各種設定" id="btn-settings">&#9881;</button>

                <div class="report-header">
                    <div class="form-group-inline">
                        <label>日付</label>
                        <input type="date" id="report-date" class="input-date">
                        <span id="report-day-of-week" class="day-label"></span>
                    </div>
                    <div class="form-group-inline">
                        <label>運転者</label>
                        <div class="select-with-btn">
                            <select id="driver-name" class="input-text">
                                <option value="">選択してください</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- 1. 乗車前 (酒気帯び確認) -->
                <div class="section-title">1. 乗車前 (酒気帯び確認)</div>
                <div class="grid-2col">
                    <div class="form-group">
                        <label>確認時刻</label>
                        <div class="time-input-group">
                            <input type="time" id="pre-check-time">
                            <button class="btn-now" data-target="pre-check-time">現在</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>確認方法</label>
                        <select id="pre-check-method">
                            <option value="対面">対面</option>
                            <option value="電話">電話</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>確認相手</label>
                        <select id="pre-checker" class="input-text">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>酒気帯び</label>
                        <div class="radio-group" id="pre-alcohol-group">
                            <label><input type="radio" name="pre-alcohol" value="無" checked> 無</label>
                            <label><input type="radio" name="pre-alcohol" value="有"> 有</label>
                        </div>
                        <input type="number" id="pre-alcohol-val" class="input-number" placeholder="数値" step="0.01"
                            style="display:none; margin-top:4px;">
                    </div>
                </div>

                <div class="form-group" style="margin-top:1.5rem;">
                    <label style="font-weight:600; color:var(--text-primary);">運行前点検</label>
                    <div class="radio-group" id="pre-inspection-group" style="margin-top:0.5rem;">
                        <label><input type="radio" name="pre-inspection" value="実施" checked> 実施</label>
                        <label><input type="radio" name="pre-inspection" value="未実施"> 未実施</label>
                    </div>
                </div>

                <hr class="divider">

                <!-- 2. 運行記録 -->
                <div class="section-title">2. 運行記録</div>

                <!-- Row 1 -->
                <div class="sub-section" style="margin-bottom: 1rem;">
                    <h4 style="color:var(--accent); border-color:var(--accent);">記録 1</h4>
                    <div class="form-group">
                        <label>訪問先・現場名等</label>
                        <input type="text" id="destination-1" class="input-text-wide" placeholder="行き先を入力">
                    </div>
                    <div class="grid-2col">
                        <!-- 出発 -->
                        <div>
                            <div class="form-group">
                                <label>出発時刻</label>
                                <div class="time-input-group">
                                    <input type="time" id="start-time-1">
                                    <button class="btn-now" data-target="start-time-1">現在</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>出発メーター</label>
                                <input type="number" id="start-meter-1" class="input-meter" placeholder="km">
                            </div>
                        </div>
                        <!-- 到着 -->
                        <div>
                            <div class="form-group">
                                <label>到着時刻</label>
                                <div class="time-input-group">
                                    <input type="time" id="end-time-1">
                                    <button class="btn-now" data-target="end-time-1">現在</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>到着メーター</label>
                                <input type="number" id="end-meter-1" class="input-meter" placeholder="km">
                            </div>
                        </div>
                    </div>
                    <div class="result-box-simple" style="margin: 0.5rem 0; padding: 0.4rem; font-size: 0.9rem;">
                        距離: <span id="calc-distance-1">0</span> km
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="sub-section" style="margin-bottom: 1rem;">
                    <div class="row-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <h4 style="color:var(--accent); border:none; margin:0;">記録 2</h4>
                        <button class="btn-toggle-row" data-target="row-2-body"
                            style="background:transparent; border:none; color:var(--text-secondary); cursor:pointer;">
                            &#9660; 開く
                        </button>
                    </div>
                    <div id="row-2-body"
                        style="display:none; margin-top:0.5rem; border-top:1px solid var(--glass-border); padding-top:0.5rem;">
                        <div class="form-group">
                            <label>訪問先・現場名等</label>
                            <input type="text" id="destination-2" class="input-text-wide" placeholder="行き先を入力">
                        </div>
                        <div class="grid-2col">
                            <!-- 出発 -->
                            <div>
                                <div class="form-group">
                                    <label>出発時刻</label>
                                    <div class="time-input-group">
                                        <input type="time" id="start-time-2">
                                        <button class="btn-now" data-target="start-time-2">現在</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>出発メーター</label>
                                    <input type="number" id="start-meter-2" class="input-meter" placeholder="km">
                                </div>
                            </div>
                            <!-- 到着 -->
                            <div>
                                <div class="form-group">
                                    <label>到着時刻</label>
                                    <div class="time-input-group">
                                        <input type="time" id="end-time-2">
                                        <button class="btn-now" data-target="end-time-2">現在</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>到着メーター</label>
                                    <input type="number" id="end-meter-2" class="input-meter" placeholder="km">
                                </div>
                            </div>
                        </div>
                        <div class="result-box-simple" style="margin: 0.5rem 0; padding: 0.4rem; font-size: 0.9rem;">
                            距離: <span id="calc-distance-2">0</span> km
                        </div>
                    </div>
                </div>

                <!-- Row 3 -->
                <div class="sub-section">
                    <div class="row-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <h4 style="color:var(--accent); border:none; margin:0;">記録 3</h4>
                        <button class="btn-toggle-row" data-target="row-3-body"
                            style="background:transparent; border:none; color:var(--text-secondary); cursor:pointer;">
                            &#9660; 開く
                        </button>
                    </div>
                    <div id="row-3-body"
                        style="display:none; margin-top:0.5rem; border-top:1px solid var(--glass-border); padding-top:0.5rem;">
                        <div class="form-group">
                            <label>訪問先・現場名等</label>
                            <input type="text" id="destination-3" class="input-text-wide" placeholder="行き先を入力">
                        </div>
                        <div class="grid-2col">
                            <!-- 出発 -->
                            <div>
                                <div class="form-group">
                                    <label>出発時刻</label>
                                    <div class="time-input-group">
                                        <input type="time" id="start-time-3">
                                        <button class="btn-now" data-target="start-time-3">現在</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>出発メーター</label>
                                    <input type="number" id="start-meter-3" class="input-meter" placeholder="km">
                                </div>
                            </div>
                            <!-- 到着 -->
                            <div>
                                <div class="form-group">
                                    <label>到着時刻</label>
                                    <div class="time-input-group">
                                        <input type="time" id="end-time-3">
                                        <button class="btn-now" data-target="end-time-3">現在</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>到着メーター</label>
                                    <input type="number" id="end-meter-3" class="input-meter" placeholder="km">
                                </div>
                            </div>
                        </div>
                        <div class="result-box-simple" style="margin: 0.5rem 0; padding: 0.4rem; font-size: 0.9rem;">
                            距離: <span id="calc-distance-3">0</span> km
                        </div>
                    </div>
                </div>

                <!-- Total -->
                <div class="result-box-simple" style="margin-top: 1rem; font-weight: bold; font-size: 1.1rem;">
                    走行距離合計: <span id="calc-distance-total">0</span> km
                </div>

                <hr class="divider">

                <!-- 3. 乗車後 (酒気帯び確認) -->
                <div class="section-title">3. 乗車後 (酒気帯び確認)</div>
                <div class="grid-2col">
                    <div class="form-group">
                        <label>確認時刻</label>
                        <div class="time-input-group">
                            <input type="time" id="post-check-time">
                            <button class="btn-now" data-target="post-check-time">現在</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>確認方法</label>
                        <select id="post-check-method">
                            <option value="対面">対面</option>
                            <option value="電話">電話</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>確認相手</label>
                        <select id="post-checker" class="input-text">
                            <option value="">選択してください</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>酒気帯び</label>
                        <div class="radio-group" id="post-alcohol-group">
                            <label><input type="radio" name="post-alcohol" value="無" checked> 無</label>
                            <label><input type="radio" name="post-alcohol" value="有"> 有</label>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- 4. その他 -->
                <div class="section-title">4. その他</div>

                <div class="grid-2col">
                    <div class="form-group">
                        <label>給油</label>
                        <div class="input-unit-group">
                            <input type="number" id="refuel-amount" placeholder="0" step="0.1">
                            <span class="unit">L</span>
                        </div>
                        <input type="number" id="refuel-meter" placeholder="給油時メーター" style="margin-top:4px;">
                    </div>
                    <div class="form-group">
                        <label>車両持帰状況</label>
                        <select id="vehicle-return">
                            <option value="">未選択</option>
                            <option value="直行">直行</option>
                            <option value="直帰">直帰</option>
                            <option value="持帰り">持帰り</option>
                            <option value="車両出社">車両出社</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top:16px;">
                    <label>特記事項</label>
                    <textarea id="notes" rows="2" class="input-textarea" placeholder="備考があれば入力"></textarea>
                </div>

                <!-- 送信ボタンエリア -->
                <div class="action-area">
                    <button id="btn-send-gas" class="btn-primary-large">
                        <span class="icon">📤</span>
                        日報を送信
                    </button>
                    <div id="status-msg" class="status-msg"></div>
                </div>

            </section>
        </main>
    </div>

    <!-- 設定モーダル (ひとまとめ) -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>各種設定</h2>
                <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">

                <!-- タブ切り替え風 -->
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="driver">運転者リスト</button>
                    <button class="tab-btn" data-tab="checker">確認者リスト</button>
                    <button class="tab-btn" data-tab="system">システム</button>
                </div>

                <!-- 運転者設定 -->
                <div id="tab-driver" class="tab-content active">
                    <p class="modal-desc">運転者名簿の編集</p>
                    <div id="driver-list-container" class="list-edit-container"></div>
                    <div class="add-item-row">
                        <input type="text" id="input-add-driver" class="input-add-item" placeholder="運転者を追加">
                        <button class="btn-add-item" id="btn-add-driver">追加</button>
                    </div>
                </div>

                <!-- 確認者設定 -->
                <div id="tab-checker" class="tab-content">
                    <p class="modal-desc">アルコールチェック確認者の編集</p>
                    <div id="checker-list-container" class="list-edit-container"></div>
                    <div class="add-item-row">
                        <input type="text" id="input-add-checker" class="input-add-item" placeholder="確認者を追加">
                        <button class="btn-add-item" id="btn-add-checker">追加</button>
                    </div>
                </div>

                <!-- システム設定 -->
                <div id="tab-system" class="tab-content">
                    <p class="modal-desc">Google Apps Script連携設定</p>
                    <div class="form-group">
                        <label>Webアプリ URL</label>
                        <input type="password" id="gas-url-input" class="input-text"
                            placeholder="https://script.google.com/..." style="width:100%">
                    </div>
                    <p class="modal-desc" style="font-size:0.8rem; margin-top:0.5rem;">
                        ※ 入力すると自動保存されます。
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="driving_report.js"></script>
</body>

</html>
